spring.application.name=MonitoreoAmbiental

# ===================================
# Configuración Moderna Spring Boot 3.3+ / 2026
# ===================================

# Activar perfil de secretos (carga application-secrets.properties)
spring.profiles.include=secrets

# Puerto de este servicio (el microservicio "sanitario" usa 8093)
server.port=8090

# URL base del microservicio "alertas" (para disparar alertas)
alertas.service.url=${ALERTAS_SERVICE_URL:https://microservicioalertas.onrender.com/api/v1/alertas/generar}
# URL base del microservicio "jaulas" (para validar que exista jaula)
jaulas.service.url=${JAULAS_SERVICE_URL:https://microserviciojaulas.onrender.com/api/v1/jaulas}


# Virtual Threads (Java 21+) - Mejora rendimiento en I/O
spring.threads.virtual.enabled=true

# Problem Details API (RFC 7807) - DESACTIVADO para usar nuestro GlobalExceptionHandler
spring.mvc.problemdetails.enabled=false

# Logging con formato legible
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Modo strict: lanza error si faltan getters/setters
spring.jackson.serialization.fail-on-empty-beans=true

# ===================================
# PostgreSQL + Hibernate (JPA) - NeonTech
# ===================================
# Las credenciales están en application-secrets.properties (excluido de Git)

spring.datasource.url=jdbc:postgresql://ep-lively-dust-ap3g0axs-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_pGLsw3YUxm8A

spring.datasource.driver-class-name=org.postgresql.Driver


# Configuraci\u00f3n de Hibernate
#update: hara la actualizacion entre lo que dice spring y BD
#create-drop: borra todo lo anterior y lo vuelve a crear
#validate:
#none: solo te estas conectando
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2


# Actuator para monitoreo (m\u00e9tricas, health checks)
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=when-authorized
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html